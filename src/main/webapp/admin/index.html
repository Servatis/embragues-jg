<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Embragues J. Gómez</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#F26522',
                            orangeHover: '#d95416',
                            sidebar: '#0F172A',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full antialiased bg-slate-900 text-slate-800 flex items-center justify-center p-4 min-h-screen relative overflow-x-hidden selection:bg-brand-orange selection:text-white">
    <!-- DECORATIVO DE FONDO CON SUTILES GRADIENTES Y PATRÓN -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black opacity-90 pointer-events-none"></div>
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-orange/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-red-900/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- TARJETA DE LOGIN CENTRADA -->
    <main class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200/80 overflow-hidden transform transition-all">

        <!-- HEADER DE LA TARJETA CON MARCA Y LOGO -->
        <div class="p-8 pb-6 bg-slate-900 text-center relative border-b border-slate-800">
            <!-- Brand Icon -->
            <div class="w-14 h-14 rounded-2xl bg-brand-orange flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg shadow-brand-orange/30">
                <i class="fa-solid fa-gears"></i>
            </div>

            <h1 class="text-xl font-extrabold text-white tracking-wider uppercase">
                EMBRAGUES <span class="text-brand-orange">J. GÓMEZ</span>
            </h1>
            <p class="text-xs font-medium text-slate-400 mt-1">
                Sistema de Administración
            </p>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="login-form" class="p-6 md:p-8 space-y-5">

            <!-- ALERTA DE ERROR (Oculta por defecto) -->
            <div id="error-alert"
                 class="hidden p-3.5 bg-red-50 border border-red-200 rounded-xl flex items-center gap-3 text-red-700 text-xs font-semibold animate-in fade-in duration-200">
                <i class="fa-solid fa-circle-exclamation text-base text-red-500 shrink-0"></i>
                <span id="error-message">Por favor, completa todos los campos correctamente.</span>
            </div>

            <!-- CAMPO USUARIO / EMAIL -->
            <div class="space-y-1.5">
                <label for="username-input" class="block text-xs font-bold uppercase tracking-wider text-slate-500">
                    USUARIO O CORREO
                </label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text"
                           id="username-input"
                           name="username"
                           required
                           autocomplete="username"
                           placeholder="admin@gomez.com"
                           class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange transition-all shadow-xs">
                </div>
            </div>

            <!-- CAMPO CONTRASEÑA -->
            <div class="space-y-1.5">
                <label for="password-input" class="block text-xs font-bold uppercase tracking-wider text-slate-500">
                    CONTRASEÑA
                </label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password"
                           id="password-input"
                           name="password"
                           required
                           autocomplete="current-password"
                           placeholder="••••••••"
                           class="w-full pl-10 pr-11 py-2.5 bg-white border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange transition-all shadow-xs">

                    <!-- Botón Mostrar/Ocultar Contraseña -->
                    <button type="button"
                            id="toggle-password-btn"
                            class="absolute right-1 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 touch-target rounded-lg focus:outline-none"
                            aria-label="Mostrar contraseña">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- BOTÓN SUBMIT -->
            <div class="pt-2">
                <button type="submit"
                        id="login-btn"
                        class="w-full py-3 px-4 bg-brand-orange hover:bg-brand-orangeHover text-white font-semibold text-sm rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 touch-target">
                    <span>Iniciar Sesión</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>

        </form>

        <!-- FOOTER DE LA TARJETA -->
        <div class="px-8 py-4 bg-slate-50 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500 font-medium">
                &copy; 2026 Embragues J. Gómez. Todos los derechos reservados.
            </p>
        </div>

    </main>

    <!-- JAVASCRIPT LÓGICA DE LOGIN -->
    <script type="module" src="js/appLogin.js" defer></script>
</body>
</html>
